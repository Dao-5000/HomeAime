<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  overflow: hidden;
  user-select: none;
}
.notify-card {
  width: 400px;
  background: rgba(30, 30, 35, 0.92);
  backdrop-filter: blur(20px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  position: relative;
  cursor: move;
  transition: box-shadow 0.2s;
  overflow: hidden;
}
.notify-card .bg-img {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.3;
  z-index: 0;
  pointer-events: none;
}
.card-body {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  padding: 12px 14px 10px;
}
.notify-card.dragging {
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #667eea;
  flex-shrink: 0;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  overflow: hidden;
  pointer-events: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  pointer-events: none;
  padding-right: 20px;
}
.header {
  display: flex;
  align-items: baseline;
  margin-bottom: 3px;
}
.name {
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  margin-right: 8px;
}
.time {
  color: rgba(255,255,255,0.45);
  font-size: 11px;
}
.msg {
  color: rgba(255,255,255,0.82);
  font-size: 13px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.msg-count {
  display: none;
  background: #f5455c;
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  border-radius: 10px;
  padding: 1px 6px;
  margin-left: 6px;
  vertical-align: middle;
}
.msg-count.show { display: inline-block; }
.close-x {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border: none;
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.6);
  border-radius: 50%;
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  -webkit-app-region: no-drag;
  pointer-events: auto;
  z-index: 20;
  opacity: 0;
}
.notify-card:hover .close-x { opacity: 1; }
.close-x:hover {
  background: rgba(255,255,255,0.25);
  color: #fff;
}
.action-bar {
  position: relative;
  z-index: 1;
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.action-bar button {
  flex: 1;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  padding: 8px 0;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-app-region: no-drag;
  pointer-events: auto;
  font-family: inherit;
}
.action-bar button:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
}
.action-bar button:active {
  background: rgba(255,255,255,0.15);
}
.action-bar .divider {
  width: 1px;
  background: rgba(255,255,255,0.08);
  flex-shrink: 0;
}

/* ===== 快捷回复输入栏 ===== */
.reply-bar {
  position: relative;
  z-index: 1;
  display: none;
  align-items: center;
  gap: 6px;
  height: 33px;
  padding: 4px 8px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.reply-bar.show {
  display: flex;
}

.reply-input {
  flex: 1;
  min-width: 0;
  height: 25px;
  padding: 0 9px;

  border: 1px solid rgba(255,255,255,0.15);
  outline: none;
  border-radius: 6px;

  background: rgba(255,255,255,0.08);
  color: #fff;

  font-family: inherit;
  font-size: 12px;

  user-select: text;
  pointer-events: auto;

  -webkit-app-region: no-drag;
}

.reply-input::placeholder {
  color: rgba(255,255,255,0.4);
}

.reply-input:focus {
  border-color: rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.12);
}

.reply-send,
.reply-cancel {
  height: 25px;
  padding: 0 9px;

  border: none;
  border-radius: 6px;

  font-size: 12px;
  font-family: inherit;

  cursor: pointer;
  pointer-events: auto;

  -webkit-app-region: no-drag;
}

.reply-send {
  background: #07c160;
  color: #fff;
}

.reply-send:hover {
  background: #06ad56;
}

.reply-send:disabled {
  opacity: 0.55;
  cursor: default;
}

.reply-cancel {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.72);
}

.reply-cancel:hover {
  background: rgba(255,255,255,0.14);
}

.notify-card {
  animation: slideIn 0.18s cubic-bezier(0.33, 1, 0.68, 1);
}
@keyframes slideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.notify-card.fade-out {
  animation: fadeOut 0.18s cubic-bezier(0.33, 1, 0.68, 1) forwards;
}
@keyframes fadeOut {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-15px); opacity: 0; }
}
</style>
</head>
<body>
<div class="notify-card" id="card">
  <div class="bg-img" id="bgImg"></div>
  <button class="close-x" id="closeBtn" title="关闭">✕</button>
  <div class="card-body">
    <div class="avatar" id="avatar">骨</div>
    <div class="content">
      <div class="header">
        <span class="name" id="name">骨子</span>
        <span class="time" id="time">刚刚</span>
        <span class="msg-count" id="msgCount"></span>
      </div>
      <div class="msg" id="msg">消息内容</div>
    </div>
  </div>
  <div class="action-bar" id="actionBar">
    <button id="replyBtn">回复</button>
    <div class="divider"></div>
    <button id="openBtn">打开聊天</button>
  </div>
  <div class="reply-bar" id="replyBar">
    <input
      id="replyInput"
      class="reply-input"
      type="text"
      autocomplete="off"
      placeholder="回复..."
    >
    <button id="replyCancelBtn" class="reply-cancel">取消</button>
    <button id="replySendBtn" class="reply-send">发送</button>
  </div>
</div>
<script>
const { ipcRenderer } = require('electron');

let autoHideTimer = null;
let currentData = null;
let audioCtx = null;

let replying = false;
let pendingReplyId = null;

function playSound(type, volume, customSound) {
  if (type === 'none') return;
  try {
    if (type === 'custom' && customSound) {
      const audio = new Audio(customSound);
      audio.volume = Math.max(0, Math.min(1, (volume || 70) / 100));
      audio.play().catch(() => {});
      return;
    }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const vol = Math.max(0, Math.min(1, (volume || 70) / 100)) * 0.4;
    const now = audioCtx.currentTime;
    if (type === 'ding') {
      [880, 1100].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, now + i * 0.12);
        gain.gain.linearRampToValueAtTime(vol, now + i * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.3);
      });
    } else if (type === 'piano') {
      [523, 659, 784].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(vol * 0.7, now + i * 0.08 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.5);
      });
    } else if (type === 'tech') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol * 0.5, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch (_) {}
}

// ===== 快捷回复模式函数 =====
function enterReplyMode() {
  if (!currentData || !currentData.contact_id) return;

  replying = true;

  if (autoHideTimer) {
    clearTimeout(autoHideTimer);
    autoHideTimer = null;
  }

  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('replyBar').classList.add('show');

  const input = document.getElementById('replyInput');
  input.value = '';

  const sendBtn = document.getElementById('replySendBtn');
  sendBtn.disabled = false;
  sendBtn.textContent = '发送';

  setTimeout(() => input.focus(), 0);
}

function exitReplyMode() {
  replying = false;
  pendingReplyId = null;

  document.getElementById('replyBar').classList.remove('show');
  document.getElementById('actionBar').style.display = '';

  const input = document.getElementById('replyInput');
  input.value = '';

  const sendBtn = document.getElementById('replySendBtn');
  sendBtn.disabled = false;
  sendBtn.textContent = '发送';
}

function submitQuickReply() {
  if (!currentData || !currentData.contact_id) return;

  const input = document.getElementById('replyInput');
  const text = String(input.value || '').trim();

  if (!text) {
    input.focus();
    return;
  }

  const requestId =
    Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);

  pendingReplyId = requestId;

  const sendBtn = document.getElementById('replySendBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = '发送中';

  ipcRenderer.send('notify-quick-reply', {
    request_id: requestId,
    contact_id: currentData.contact_id,
    text,
  });
}

ipcRenderer.on('show-notify', (event, data) => {
  currentData = data;

  // 新通知到来时恢复标准通知状态
  exitReplyMode();

  const card = document.getElementById('card');
  card.classList.remove('fade-out');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';

  document.getElementById('name').textContent = data.name || 'AI伴侣';
  document.getElementById('msg').textContent = data.content || '';
  document.getElementById('time').textContent = data.time || '刚刚';
  const avatar = document.getElementById('avatar');
  if (data.avatar) {
    avatar.innerHTML = '<img src="' + data.avatar + '">';
  } else {
    avatar.textContent = (data.name || 'AI').charAt(0);
  }
  const countEl = document.getElementById('msgCount');
  if (data.msgCount && data.msgCount > 1) {
    countEl.textContent = data.msgCount + '条新消息';
    countEl.classList.add('show');
  } else {
    countEl.classList.remove('show');
  }
  if (data.bgColor) card.style.background = data.bgColor;
  if (data.bgOpacity != null && data.bgColor) {
    const hex = data.bgColor;
    if (hex.startsWith('#') && hex.length === 7) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      card.style.background = 'rgba(' + r + ',' + g + ',' + b + ',' + data.bgOpacity + ')';
    }
  }
  if (data.textColor) {
    document.getElementById('name').style.color = data.textColor;
    document.getElementById('msg').style.color = data.textColor;
  } else {
    document.getElementById('name').style.color = '';
    document.getElementById('msg').style.color = '';
  }
  if (data.borderColor) card.style.borderColor = data.borderColor;
  if (data.bgImage) {
    document.getElementById('bgImg').style.backgroundImage = 'url(' + data.bgImage + ')';
  } else {
    document.getElementById('bgImg').style.backgroundImage = '';
  }
  if (data.fontSize) {
    document.getElementById('msg').style.fontSize = data.fontSize + 'px';
    document.getElementById('name').style.fontSize = (data.fontSize + 1) + 'px';
  }
  if (data.width) card.style.width = data.width + 'px';
  if (data.height) card.style.height = data.height + 'px';
  else card.style.height = '';
  if (!data._silent) {
    playSound(data.sound || 'ding', data.volume, data.customSound);
  }
  if (autoHideTimer) clearTimeout(autoHideTimer);
  const hideMs = data.autoHideMs || 5000;
  autoHideTimer = setTimeout(() => hideNotify(), hideMs);
});

// 接收主页面回复结果
ipcRenderer.on('notify-quick-reply-result', (event, result) => {
  if (!result || result.request_id !== pendingReplyId) return;

  const sendBtn = document.getElementById('replySendBtn');

  if (result.ok) {
    pendingReplyId = null;

    // 用户消息已经写入主窗口 Store
    // 此时直接关闭通知即可
    hideNotify();
    return;
  }

  pendingReplyId = null;

  sendBtn.disabled = false;
  sendBtn.textContent = '发送';

  const input = document.getElementById('replyInput');

  if (result.error) {
    input.placeholder = result.error;

    setTimeout(() => {
      input.placeholder = '回复...';
    }, 2500);
  }

  input.focus();
});

function hideNotify() {
  const card = document.getElementById('card');
  card.classList.add('fade-out');
  setTimeout(() => ipcRenderer.send('notify-hidden'), 180);
}

function bindBtn(id, action) {
  const btn = document.getElementById(id);
  btn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    action();
  });
}

bindBtn('closeBtn', () => hideNotify());
bindBtn('replyBtn', () => {
  // 不再打开主窗口，原地进入回复模式
  enterReplyMode();
});
bindBtn('openBtn', () => {
  ipcRenderer.send('notify-open', currentData);
  hideNotify();
});

// 快捷回复发送/取消按钮
bindBtn('replySendBtn', () => {
  submitQuickReply();
});
bindBtn('replyCancelBtn', () => {
  exitReplyMode();
});

// 回复输入框键盘事件
document.getElementById('replyInput').addEventListener('keydown', (e) => {
  e.stopPropagation();

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitQuickReply();
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    exitReplyMode();
  }
});

let isDragging = false;
let startX, startY;
const card = document.getElementById('card');

card.addEventListener('mousedown', (e) => {
  // 输入框也不能触发窗口拖动
  if (e.target.closest('button, input')) return;
  isDragging = true;
  card.classList.add('dragging');
  startX = e.screenX;
  startY = e.screenY;
  ipcRenderer.send('notify-drag-start');
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.screenX - startX;
  const dy = e.screenY - startY;
  ipcRenderer.send('notify-drag-move', { dx, dy });
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    card.classList.remove('dragging');
    ipcRenderer.send('notify-drag-end');
  }
});

card.addEventListener('mouseenter', () => {
  if (autoHideTimer) clearTimeout(autoHideTimer);
});
card.addEventListener('mouseleave', () => {
  if (autoHideTimer) clearTimeout(autoHideTimer);

  // 正在输入回复时绝对不能自动消失
  if (replying) return;

  autoHideTimer = setTimeout(() => hideNotify(), 3000);
});
</script>
</body>
</html>
